apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: desafio/rds/postgres
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: desafio/rds/postgres
        property: password
    - secretKey: PGHOST
      remoteRef:
        key: desafio/rds/postgres
        property: host
    - secretKey: PGDATABASE
      remoteRef:
        key: desafio/rds/postgres
        property: dbname
