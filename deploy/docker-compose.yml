name: desafio-aws-eks

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: challenge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ../app/api
    image: desafio-api:local
    environment:
      PGHOST: db
      PGUSER: challenge
      PGPASSWORD: challenge
      PGDATABASE: challenge
      ENABLE_CLOUDWATCH_METRICS: "false"
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ../app/frontend
    image: desafio-frontend:local
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
